<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open English — SEO Content Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.bunny.net/css?family=wix-madefor-display:300,400,600,700|wix-madefor-text:300,400,600,700" rel="stylesheet">
<style>
:root{
  --oe-blue:#0066FF;--oe-orange:#FF6600;--soft-blue:#E5F5FF;--white:#fff;
  --grey-line:#D6D6D6;--grey-bg:#F4F4F4;--grey-light:#FAFAFA;
  --grad-blue:linear-gradient(135deg,#0066FF,#0099FF);
  --font-d:'Poppins',sans-serif;--font-t:'Wix Madefor Display',sans-serif;--font-b:'Wix Madefor Text',sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.10);--sh-lg:0 8px 24px rgba(0,0,0,.12);
  --r-sm:4px;--r-md:8px;--r-lg:16px;--r-full:9999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:var(--grey-light);color:#1a1a2e;min-height:100vh;font-size:15px}
.hdr{background:var(--grad-blue);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh-md);position:sticky;top:0;z-index:200}
.hdr-brand{display:flex;align-items:center;gap:14px}
.hdr-logo{width:38px;height:38px;background:#fff;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--oe-blue);font-size:16px;letter-spacing:-1px;flex-shrink:0}
.hdr-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:#fff}
.hdr-sub{font-family:var(--font-b);font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.hdr-actions{display:flex;gap:10px;align-items:center}
.btn{font-family:var(--font-t);font-weight:700;font-size:13px;border:none;border-radius:var(--r-full);padding:10px 22px;cursor:pointer;transition:all .17s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--oe-orange);color:#fff;box-shadow:var(--sh-sm)}
.btn-primary:hover{background:#e55c00;box-shadow:var(--sh-md);transform:translateY(-1px)}
.btn-lang{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.7)!important;color:#fff;font-size:13px;padding:8px 16px;letter-spacing:.5px}
.btn-lang:hover{background:#fff;color:var(--oe-blue)}
.btn-outline{background:transparent;border:2px solid rgba(255,255,255,.6);color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--grey-line);color:#555;font-size:12px;padding:8px 16px}
.btn-ghost:hover{border-color:var(--oe-blue);color:var(--oe-blue)}
.btn-danger{background:#fee2e2;color:#dc2626;border:none;font-size:12px;padding:8px 16px}
.btn-danger:hover{background:#fecaca}
.tabs-wrap{background:#fff;border-bottom:2px solid var(--grey-line);padding:0 32px;overflow-x:auto;position:sticky;top:70px;z-index:150;box-shadow:var(--sh-sm)}
.tabs{display:flex;gap:0;min-width:max-content}
.tab{font-family:var(--font-t);font-weight:600;font-size:13px;color:#888;padding:14px 20px 13px;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;transition:all .18s;display:flex;align-items:center;gap:7px;white-space:nowrap;position:relative;top:2px}
.tab:hover{color:var(--oe-blue);background:var(--soft-blue)}
.tab.active{color:var(--oe-blue);border-bottom-color:var(--oe-blue);background:var(--soft-blue)}
.tab-badge{background:var(--grey-bg);color:#888;font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--r-full)}
.tab.active .tab-badge{background:var(--oe-blue);color:#fff}
.main{max-width:1700px;margin:0 auto;padding:24px 32px}
.stats{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--sh-sm);border:1.5px solid var(--grey-line);cursor:pointer;transition:box-shadow .17s;flex:1;min-width:130px}
.stat:hover{box-shadow:var(--sh-md)}
.stat.active{border-color:var(--oe-blue);background:var(--soft-blue)}
.stat-lbl{font-family:var(--font-t);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#999;margin-bottom:6px}
.stat-val{font-family:var(--font-d);font-size:28px;font-weight:700;color:var(--oe-blue);line-height:1}
.stat.orange .stat-val{color:var(--oe-orange)}
.stat.green .stat-val{color:#16a34a}
.stat.purple .stat-val{color:#7c3aed}
.stat.teal .stat-val{color:#0891b2}
.controls{background:#fff;border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--sh-sm);border:1.5px solid var(--grey-line);margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.srch-wrap{position:relative;flex:1;min-width:220px}
.srch-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#bbb;pointer-events:none}
.srch{width:100%;padding:10px 14px 10px 40px;border:1.5px solid var(--grey-line);border-radius:var(--r-full);font-family:var(--font-b);font-size:14px;outline:none;background:var(--grey-light);transition:border-color .18s}
.srch:focus{border-color:var(--oe-blue);background:#fff}
.flt{display:flex;gap:10px;flex-wrap:wrap}
select.fsel{padding:10px 14px;border:1.5px solid var(--grey-line);border-radius:var(--r-full);font-family:var(--font-t);font-size:13px;font-weight:600;outline:none;background:var(--grey-light);cursor:pointer;transition:border-color .18s}
select.fsel:focus{border-color:var(--oe-blue)}
.ctrl-right{display:flex;gap:10px;align-items:center;margin-left:auto}
.tbl-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-sm);border:1.5px solid var(--grey-line);overflow:hidden}
.tbl-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1.5px solid var(--grey-line);background:var(--grey-bg)}
.tbl-count{font-family:var(--font-t);font-size:13px;font-weight:600;color:#777}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{font-family:var(--font-t);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#888;padding:11px 14px;text-align:left;background:var(--grey-bg);border-bottom:1.5px solid var(--grey-line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--oe-blue)}
thead th.sorted{color:var(--oe-blue)}
.srt{display:inline-block;margin-left:3px;opacity:.35;font-size:10px}
thead th.sorted .srt{opacity:1}
tbody tr{border-bottom:1px solid #f0f0f0;transition:background .12s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--soft-blue)}
tbody td{padding:10px 14px;font-size:13px;vertical-align:middle;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-kw{font-family:var(--font-t);font-weight:600;color:#1a1a2e;max-width:210px}
.td-meta{color:#555;max-width:220px}
.td-url a,.td-doc a{color:var(--oe-blue);text-decoration:none;font-size:12px}
.td-url a:hover,.td-doc a:hover{text-decoration:underline}
.td-num{text-align:center;font-family:var(--font-t);font-weight:600;font-size:12px}
.td-center{text-align:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-full);font-family:var(--font-t);font-size:11px;font-weight:600;white-space:nowrap}
.b-pub{background:#dcfce7;color:#15803d}.b-sched{background:#dbeafe;color:#1d4ed8}
.b-pend{background:var(--grey-bg);color:#777}.b-prod{background:#fef9c3;color:#854d0e}
.b-upd{background:#ccfbf1;color:#0f766e}
.b-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.lpill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 8px;border-radius:var(--r-full);font-family:var(--font-t);font-size:11px;font-weight:700}
.lg{background:#dcfce7;color:#15803d}.lw{background:#fef9c3;color:#854d0e}.lb{background:#fee2e2;color:#dc2626}.le{background:var(--grey-bg);color:#bbb}
.sbar{display:flex;align-items:center;gap:7px}
.sbg{flex:1;height:5px;background:var(--grey-bg);border-radius:var(--r-full);overflow:hidden;min-width:44px}
.sfill{height:100%;border-radius:var(--r-full);background:var(--grad-blue)}
.slbl{font-family:var(--font-t);font-size:11px;font-weight:600;color:#666;min-width:30px;text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1.5px solid var(--grey-line);background:var(--grey-bg);flex-wrap:wrap;gap:10px}
.pager-info{font-family:var(--font-b);font-size:13px;color:#888}
.pager-btns{display:flex;gap:6px;align-items:center}
.pbtn{width:34px;height:34px;border-radius:var(--r-full);border:1.5px solid var(--grey-line);background:#fff;font-family:var(--font-t);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pbtn:hover:not(:disabled){border-color:var(--oe-blue);color:var(--oe-blue)}
.pbtn.active{background:var(--oe-blue);color:#fff;border-color:var(--oe-blue)}
.pbtn:disabled{opacity:.3;cursor:default}
.psz{padding:7px 12px;border:1.5px solid var(--grey-line);border-radius:var(--r-full);font-family:var(--font-t);font-size:13px;outline:none;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:flex-start;justify-content:flex-end;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.panel{width:540px;max-width:100vw;height:100vh;background:#fff;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:sIn .22s ease}
@keyframes sIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.pan-hdr{background:var(--grad-blue);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pan-title{font-family:var(--font-d);font-weight:700;font-size:17px;color:#fff}
.pan-x{width:30px;height:30px;border-radius:var(--r-full);border:none;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pan-x:hover{background:rgba(255,255,255,.35)}
.pan-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.fgrp{display:flex;flex-direction:column;gap:6px}
.flbl{font-family:var(--font-t);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#999}
.finput,.fsel-m,.ftxt{width:100%;padding:10px 14px;border:1.5px solid var(--grey-line);border-radius:var(--r-md);font-family:var(--font-b);font-size:14px;outline:none;background:var(--grey-light);transition:border-color .18s}
.finput:focus,.fsel-m:focus,.ftxt:focus{border-color:var(--oe-blue);background:#fff}
.ftxt{resize:vertical;min-height:68px}
.fhint{font-size:11px;color:#bbb;font-family:var(--font-b)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pan-ftr{padding:14px 24px;border-top:1.5px solid var(--grey-line);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;background:var(--grey-bg)}
.toast{position:fixed;bottom:28px;right:28px;opacity:0;visibility:hidden;pointer-events:none;background:#1a1a2e;color:#fff;padding:13px 20px;border-radius:var(--r-lg);font-family:var(--font-t);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);z-index:999;transform:translateY(20px);transition:transform .3s,opacity .3s,visibility .3s}
.toast.show{transform:translateY(0);opacity:1;visibility:visible}
.empty{text-align:center;padding:64px 32px;color:#ccc}
.empty h3{font-family:var(--font-t);font-size:18px;font-weight:600;margin-top:14px;color:#ddd}
.empty p{font-size:13px;margin-top:6px}
@media(max-width:768px){
  .main{padding:16px}.hdr{padding:14px 16px}.tabs-wrap{padding:0 16px}
  .stats{gap:10px}.stat{min-width:100px}.panel{width:100vw}.frow{grid-template-columns:1fr}
}

/* Loading overlay */
#loadingOverlay{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loadingOverlay .spinner{width:44px;height:44px;border:4px solid #d0d9f5;border-top-color:#0066FF;border-radius:50%;animation:spin .8s linear infinite}
#loadingOverlay .ld-msg{font-family:var(--font-t);font-size:14px;color:#555}
#errorBanner{display:none;background:#fff0f0;border:1.5px solid #f66;border-radius:var(--r-md);padding:14px 18px;margin:16px 32px;color:#c00;font-family:var(--font-b);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">OE</div>
    <div>
      <div class="hdr-title">SEO Content Dashboard</div>
      <div class="hdr-sub">Open English · Content Repository</div>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="btn btn-outline" onclick="refreshData()" title="Reload data from the spreadsheet">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Refresh

    <button class="btn btn-outline" onclick="exportHTML()">

    </button>
    <button class="btn btn-primary" onclick="newContentClaude()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>

<div class="tabs-wrap">

</div>

<main class="main">
  <div class="stats" id="statsRow"></div>
  <div class="controls">
    <div class="srch-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="srch" id="srch" type="search" placeholder="Search by keyword, URL, title…" oninput="onSrch()">
    </div>

        <option value="">All statuses</option>

    </div>

        <span style="font-family:var(--font-b);font-size:11px;color:#aaa">Per page:</span>
        <select class="psz" id="pgSz" onchange="onPgSz()">
          <option value="25">25</option><option value="50" selected>50</option>
          <option value="100">100</option><option value="9999">All</option>

</main>

<div class="overlay" id="overlay" onclick="onOvClick(event)">

    <div class="pan-hdr">

</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="ld-msg">Loading spreadsheet data…</div>
</div>
<div id="errorBanner"></div>
<div class="toast" id="toast"></div>
<script>

let SD = {};

/* ─── Live Google Sheets fetch ─────────────────────────────────── */
const SPREADSHEET_ID = "1_hwUhgp0k9m2Ff1Vx3B3GjxxSXj0wtxmgIo6lB5mQ0k";

function showLoading(v) {
  const el = document.getElementById("loadingOverlay");
  if (el) el.style.display = v ? "flex" : "none";
}
function showError(msg) {
  const el = document.getElementById("errorBanner");
  if (!el) return;
  el.textContent = msg;
  el.style.display = "block";
}
function hideError() {
  const el = document.getElementById("errorBanner");
  if (el) el.style.display = "none";
}

// Loads a sheet tab via JSONP (script tag). Unlike fetch(), this also works
// when the dashboard is opened as a local file or from any host (no CORS needed).
let _jsonpSeq = 0;
function loadGviz(tabName) {
  return new Promise((resolve, reject) => {
    const cb = "__gviz_cb_" + (++_jsonpSeq) + "_" + Date.now();
    const script = document.createElement("script");
    const cleanup = () => { delete window[cb]; script.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { cleanup(); reject(new Error("Timeout for " + tabName)); }, 20000);
    window[cb] = json => { cleanup(); resolve(json); };
    script.onerror = () => { cleanup(); reject(new Error("Network error for " + tabName)); };
    script.src = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID
      + "/gviz/tq?headers=1&sheet=" + encodeURIComponent(tabName)
      + "&tqx=responseHandler:" + cb + "&_=" + Date.now();
    document.head.appendChild(script);
  });
}

async function fetchTab(tabName) {
  const json = await loadGviz(tabName);
  if (json.status === "error") throw new Error((json.errors && json.errors[0] && json.errors[0].detailed_message) || ("Error for " + tabName));
  if (!json.table || !json.table.cols) throw new Error("Empty table: " + tabName);

  const allHeaders = json.table.cols.map(c => (c.label || "").trim());
  // Filter out columns with empty labels (hidden/unnamed columns)
  const validCols = allHeaders.map((h, i) => ({h, i})).filter(x => x.h !== "");
  const headers = validCols.map(x => x.h);

  const rows = (json.table.rows || []).map(row => {
    const obj = {};
    validCols.forEach(({h, i}) => {
      const cell = row.c ? row.c[i] : null;
      if (!cell || cell.v == null) {
        obj[h] = "";
      } else {
        // Format dates from Date(year,month,day) objects to readable strings
        if (typeof cell.v === "string" && cell.v.startsWith("Date(")) {
          try {
            const parts = cell.v.slice(5,-1).split(",").map(Number);
            const d = new Date(parts[0], parts[1], parts[2]);
            obj[h] = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
          } catch(e) { obj[h] = cell.f || cell.v; }
        } else {
          obj[h] = typeof cell.v === "number" ? String(cell.v) : cell.v;
        }
        // Capture Google Doc hyperlink URL from the cell's p property
        if (h === "Doc" && cell.p && cell.p.url) {
          obj["Doc_url"] = cell.p.url;
        }
      }
    });
    return obj;
  }).filter(o => Object.values(o).some(v => String(v).trim() !== ""));  // drop empty rows

  return { headers, rows };
}

async function fetchAllTabs() {
  showLoading(true);
  hideError();
  const results = await Promise.allSettled(TABS.map(t => fetchTab(t.key)));
  const errors = [];
  results.forEach((r, i) => {
    const t = TABS[i];
    if (r.status === "fulfilled") {
      SD[t.key] = r.value;
    } else {
      console.warn("Error loading " + t.key + ":", r.reason);
      if (!SD[t.key]) SD[t.key] = { headers: [], rows: [] };
      errors.push(t.label);
    }
  });
  showLoading(false);
  if (errors.length > 0 && errors.length === TABS.length) {
    showError('❌ Could not load the data. Make sure the spreadsheet is shared publicly with viewer access.');
  } else if (errors.length > 0) {
    showToast("⚠️ Error loading: " + errors.join(", "));
  }
  return errors.length < TABS.length;
}

async function refreshData() {
  const ok = await fetchAllTabs();
  buildTabs();
  switchTab(activeTab);
  if (ok) showToast("🔄 Data refreshed from the spreadsheet!");
}
/* ─────────────────────────────────────────────────────────────── */

const TABS = [
  {key:"Blog LATAM",          icon:"🌎", label:"Blog LATAM",        type:"blog"},
  {key:"Blog Brazil",         icon:"🇧🇷", label:"Blog Brazil",       type:"blog"},
  {key:"Optmization Blog LT", icon:"🛠️", label:"Optimization Blog LT", type:"optim"},
  {key:"Optmization Blog BR", icon:"🛠️", label:"Optimization Blog BR", type:"optim"},
  {key:"Review Site LATAM",   icon:"⭐", label:"Review LATAM",      type:"review_latam"},
  {key:"Review Site Brazil",  icon:"⭐", label:"Review Brazil",     type:"review_brazil"}
];

const COLS = {

function onSrch() { searchQ = document.getElementById("srch").value.toLowerCase(); curPage=1; render(); }
function clearFilters() {
  document.getElementById("srch").value=""; document.getElementById("fStatus").value="";
  searchQ=""; curPage=1; render();
}

function getFiltered() {
  const fs = document.getElementById("fStatus").value;
  return rows().filter(r => {
    if (fs && (r.Status||"") !== fs) return false;
    if (searchQ && !Object.values(r).join(" ").toLowerCase().includes(searchQ)) return false;
    return true;
  });
}

function getSorted(arr) {
  if (!sortCol) return arr;
  const numCols = ["Meta title length","Meta description length","Clicks","Impressions","Position","Search Volume"];
  return [...arr].sort((a,b) => {
    let va = a[sortCol]||"", vb = b[sortCol]||"";
    if (numCols.includes(sortCol)) { va=parseFloat(va)||0; vb=parseFloat(vb)||0; return (va-vb)*sortDir; }
    if (sortCol==="SERP Score") { va=parseFloat(String(va).replace("%",""))||0; vb=parseFloat(String(vb).replace("%",""))||0; return (va-vb)*sortDir; }
    return sortDir * String(va).localeCompare(String(vb),"en",{sensitivity:"base"});
  });
}

function sortBy(col) {
  if (sortCol===col) sortDir*=-1; else{sortCol=col;sortDir=1;}
  curPage=1; render();
}

function onPgSz() { pgSize=parseInt(document.getElementById("pgSz").value); curPage=1; render(); }

function renderHead() {
  const cs = cols();
  let ths = cs.map(c => {
    const srtAttr = c.s ? ` onclick="sortBy('${c.k}')"` : ` style="cursor:default"`;
    const srtIcon = c.s ? `<span class="srt" data-col="${c.k}">↕</span>` : "";
    return `<th${srtAttr}>${c.l}${srtIcon}</th>`;
  });
  ths.push(`<th style="text-align:center;cursor:default">Actions</th>`);
  document.getElementById("tblHead").innerHTML = `<tr>${ths.join("")}</tr>`;
}

function render() {
  const filtered = getFiltered();
  const sorted = getSorted(filtered);
  const total = sorted.length;
  const totalPages = Math.max(1, Math.ceil(total/pgSize));
  if (curPage > totalPages) curPage = totalPages;
  const st = (curPage-1)*pgSize, en = Math.min(st+pgSize, total);
  document.getElementById("tblCount").textContent = `${total} item${total!==1?"s":""} found`;
  renderRows(sorted.slice(st, en));
  renderPager(total, totalPages, st, en);
  // Update sort icons
  document.querySelectorAll(".srt").forEach(el => {
    el.textContent = el.dataset.col === sortCol ? (sortDir===1?"↑":"↓") : "↕";
    el.style.opacity = el.dataset.col === sortCol ? "1" : ".35";
  });
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function trunc(s,n) { return !s?"": s.length>n? s.slice(0,n)+"…":s; }

function cellHTML(r, c) {
  const v = r[c.k] || "";
  if (c.badge) {
    const map = {Published:"b-pub",Scheduled:"b-sched",Pending:"b-pend","In production":"b-prod",Updated:"b-upd"};
    if (!v) return `<td><span style="color:#ccc;font-size:11px">—</span></td>`;
    const cls = map[v] || "b-pend";
    return `<td><span class="badge ${cls}"><span class="b-dot"></span>${esc(v)}</span></td>`;
  }
  if (c.pill) {
    const n = parseInt(v)||0;
    if (!n) return `<td class="td-num"><span class="lpill le">—</span></td>`;
    let pc="lb";
    if(c.pill==="title"){if(n>=50&&n<=60)pc="lg";else if((n>=45&&n<50)||(n>60&&n<=65))pc="lw";}
    else{if(n>=120&&n<=160)pc="lg";else if((n>=100&&n<120)||(n>160&&n<=175))pc="lw";}
    return `<td class="td-num"><span class="lpill ${pc}">${n}</span></td>`;
  }
  if (c.serp) {
    const pct = parseFloat(String(v).replace("%",""))||0;
    if (!pct) return `<td class="td-center"><span style="color:#ccc;font-size:11px">—</span></td>`;
    return `<td class="td-center"><div class="sbar"><div class="sbg"><div class="sfill" style="width:${Math.min(pct,100)}%"></div></div><span class="slbl">${Math.round(pct)}%</span></div></td>`;
  }
  if (c.link) {
    const display = trunc(String(v).replace(/https?:\/\/(www\.)?/,""), 32);
    const inner = v && v.startsWith("http")
      ? `<a href="${esc(v)}" target="_blank" onclick="event.stopPropagation()">${esc(display)}</a>`
      : esc(trunc(v, 32));
    return `<td class="${c.cl}">${inner}</td>`;
  }
  if (c.doc) {
    const docUrl = r.Doc_url || (v && v.startsWith('http') ? v : null);
    const inner = docUrl
      ? `<a href="${esc(docUrl)}" target="_blank" onclick="event.stopPropagation()" title="${esc(v||'View doc')}">📄 View</a>`
      : (v ? esc(trunc(v,28)) : `<span style="color:#ddd">—</span>`);
    return `<td class="${c.cl}">${inner}</td>`;
  }
  if (c.jira) {
    const inner = v ? `<span style="font-family:var(--font-t);font-size:11px;background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:9999px">${esc(v)}</span>` : "";
    return `<td>${inner}</td>`;
  }
  if (c.date) {
    return `<td><span style="font-size:11px;color:#999;white-space:nowrap">${esc(v)}</span></td>`;
  }
  return `<td class="${c.cl}"><span title="${esc(v)}">${esc(trunc(v,38))}</span></td>`;
}

function renderRows(page) {
  const cs = cols();
  const tbody = document.getElementById("tblBody");
  if (!page.length) {
    tbody.innerHTML = `<tr><td colspan="${cs.length+1}"><div class="empty">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <h3>${t('noResults')}</h3><p>Try adjusting the search or filters.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = page.map(r => {
    const idx = rows().indexOf(r);
    const cells = cs.map(c => cellHTML(r, c)).join("");
    return `<tr onclick="openModal(${idx})">${cells}`
      + `<td style="text-align:center" onclick="event.stopPropagation()">`
      + `<button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="event.stopPropagation();openModal(${idx})">✏️</button></td></tr>`;
  }).join("");
}

function renderPager(total, totalPages, st, en) {
  const el = document.getElementById("pager");
  if (totalPages <= 1) { el.innerHTML = `<span class="pager-info">${total} item${total!==1?"s":""}</span>`; return; }
  const nums = (() => {
    if(totalPages<=7)return Array.from({length:totalPages},(_,i)=>i+1);
    const p=[1];
    if(curPage>3)p.push("…");
    for(let i=Math.max(2,curPage-1);i<=Math.min(totalPages-1,curPage+1);i++)p.push(i);
    if(curPage<totalPages-2)p.push("…");
    p.push(totalPages);return p;
  })();
  let btns = `<button class="pbtn" onclick="goPage(${curPage-1})" ${curPage===1?"disabled":""}>‹</button>`;
  nums.forEach(p => {
    if(p==="…") btns+=`<span style="padding:0 5px;color:#bbb;line-height:34px">…</span>`;
    else btns+=`<button class="pbtn${p===curPage?" active":""}" onclick="goPage(${p})">${p}</button>`;
  });
  btns+=`<button class="pbtn" onclick="goPage(${curPage+1})" ${curPage===totalPages?"disabled":""}>›</button>`;
  el.innerHTML = `<span class="pager-info">${st+1}–${en} of ${total}</span><div class="pager-btns">${btns}</div>`;
}

function goPage(p) {
  const t = Math.ceil(getFiltered().length/pgSize);
  if(p<1||p>t)return;
  curPage=p; render();
  document.querySelector(".tbl-card").scrollIntoView({behavior:"smooth",block:"start"});
}

    + mkGrp("Meta Description", mkTxt("fMD", v("Meta description"), "120–160 chars"))
    + mkGrp("URL", mkInp("fURL","url",v("URL"),"https://…"))
    + mkRow(mkGrp("Status", mkSel("fStatusM",statOpts,v("Status")||"In production")),
            mkGrp("Deploy Date", mkInp("fDate","date",dateVal,"")))
    + mkRow(mkGrp("SERP Score", mkInp("fSerp","text",v("SERP Score"),"e.g. 77%")),
            mkGrp("JIRA", mkInp("fJIRA","text",v("JIRA"),"e.g. WEB-14755")))
    + mkRow(mkGrp("STG Link", mkInp("fSTG","url",v("STG Link"),"https://stg…")),
            mkGrp("Briefing", mkInp("fBriefS","text",v("Briefing"),"briefing")));
}

function updLens() {
  const mt = document.getElementById("fMT");
  const md = document.getElementById("fMD");
  const tl = document.getElementById("mTLen");
  const dl = document.getElementById("mDLen");
  if(mt&&tl){tl.textContent="("+mt.value.length+" chars)";tl.style.color=(mt.value.length>=50&&mt.value.length<=60)?"#16a34a":"#dc2626";}
  if(md&&dl){dl.textContent="("+md.value.length+" chars)";dl.style.color=(md.value.length>=120&&md.value.length<=160)?"#16a34a":"#dc2626";}
}

function saveEntry() {
  const ct = colType();
  const statSel = document.getElementById("fStatusM");
  const status = statSel ? statSel.value : "In production";
  let entry = {};
  const fmtDate = id => gv(id);  // keep YYYY-MM-DD, same format as the dates loaded from the sheet

  if (ct === "blog") {
    const mt = gv("fMT");
    const md = (document.getElementById("fMD")||{}).value||"";
    entry = {KW:gv("fKW"),URL:gv("fURL"),Doc:gv("fDoc"),"Meta title":mt,
      "Meta title length":String(mt.length||""),"Meta Description":md.trim(),
      "Meta description length":String(md.trim().length||""),Status:status,
      "Update date":fmtDate("fDate"),"SERP Score":gv("fSerp"),
      Position:gv("fPos"),Clicks:gv("fClk"),Impressions:gv("fImp"),CTR:""};
  } else if (ct === "optim") {
    const mt = gv("fMT");
    const md = (document.getElementById("fMD")||{}).value||"";
    entry = {URL:gv("fURL"),KW:gv("fKW"),Doc:gv("fDoc"),Doc_url:gv("fDoc"),"Meta title":mt,
      "Meta title length":String(mt.length||""),"Meta Description":md.trim(),
      "Meta description length":String(md.trim().length||""),Status:status,
      "Update date":fmtDate("fDate")};
  } else if (ct === "web") {
    const brief = (document.getElementById("fBrief")||{}).value||"";
    entry = {Page:gv("fPage"),"Briefing/Work Order":brief.trim(),JIRA:gv("fJIRA"),Status:status,"Deploy date":fmtDate("fDate")};
  } else if (ct === "review_latam") {
    const brief = (document.getElementById("fBrief")||{}).value||"";
    entry = {Keyword:gv("fKW"),"Search Volume":gv("fVol"),Title:gv("fTitle"),URL:gv("fURL"),
      Status:status,"Publish Date":fmtDate("fDate"),Briefing:brief.trim(),"STG Link":gv("fSTG"),JIRA:gv("fJIRA")};
  } else {
    const md = (document.getElementById("fMD")||{}).value||"";
    entry = {Keyword:gv("fKW"),"Search Volume":gv("fVol"),Title:gv("fTitle"),
      "Meta tittle":gv("fMT"),"Meta description":md.trim(),URL:gv("fURL"),
      Status:status,"Deploy Date":fmtDate("fDate"),"SERP Score":gv("fSerp"),
      JIRA:gv("fJIRA"),"STG Link":gv("fSTG"),Briefing:gv("fBriefS")};
  }

  const r = SD[activeTab].rows;
  if (editIdx !== null) { r[editIdx] = entry; showToast("✅ Updated!"); }
  else { r.unshift(entry); showToast("✅ Added!"); }
  closeModal(); buildTabs(); renderStats(); render();
}

function deleteEntry() {
  if (editIdx===null || !confirm("Delete this content?")) return;
  SD[activeTab].rows.splice(editIdx,1);
  closeModal(); buildTabs(); renderStats(); render();
  showToast("🗑️ Deleted.");
}

function showToast(msg, ms=2800) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

function exportHTML() {
  const dataStr = JSON.stringify(SD);
  const src = document.documentElement.outerHTML;
  const marker = "let SD = ";
  const pos = src.indexOf(marker);
  if (pos === -1) { showToast("⚠️ Export error."); return; }
  // Find end of the object literal after the marker
  let depth=0, i=pos+marker.length, inStr=false, esc_=false;
  while(i < src.length) {
    const c = src[i];
    if(esc_){esc_=false;i++;continue;}
    if(inStr){if(c==="\\")esc_=true;else if(c==='"')inStr=false;i++;continue;}
    if(c==='"')inStr=true;
    else if(c==="["||c==="{")depth++;
    else if(c==="]"||c==="}"){depth--;if(depth===0){i++;break;}}
    i++;
  }
  const newSrc = src.slice(0,pos+marker.length) + dataStr + src.slice(i);
  const blob = new Blob([newSrc],{type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="oe-seo-dashboard.html"; a.click();
  URL.revokeObjectURL(a.href);
  showToast("📥 HTML exported! Commit it to GitHub.");
}

document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });
